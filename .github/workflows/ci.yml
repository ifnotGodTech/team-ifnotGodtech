name: CI

# Every pull request, and every change reaching staging or main, must pass these before it's merged or released.
# The browser tests need the backend repository and PostgreSQL, so they run on a laptop before merging into
# staging (see the backend's docs/releasing.md).

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npx vitest run
      - name: Production build
        run: npm run build
